name: Build KALMUTTTG MP4 Video

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECK OUT REPOSITORY
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. LOCATE AND EXTRACT PROJECT ZIP
      # ==========================================================
      - name: Locate and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR PROJECT ZIP"
          echo "=========================================="

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project

          echo ""
          echo "EXTRACTED PROJECT:"
          find extracted_project -maxdepth 8 -type f | sort


      # ==========================================================
      # 3. LOCATE HTML VIDEO PROJECT
      # ==========================================================
      - name: Locate video project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r index_file; do

            DIR="$(dirname "$index_file")"

            if [ -f "$DIR/index.html" ] && \
               [ -f "$DIR/render.js" ] && \
               [ -f "$DIR/package.json" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find extracted_project \
              -type f \
              -name "index.html" \
              -print \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: KALMUTTTG HTML video project could not be located."

            echo ""
            echo "Expected:"
            echo "  index.html"
            echo "  render.js"
            echo "  package.json"

            echo ""
            echo "Extracted structure:"
            find extracted_project -maxdepth 10 -print | sort

            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo ""
          echo "=========================================="
          echo "VIDEO PROJECT FOUND"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 4. VERIFY PROJECT FILES
      # ==========================================================
      - name: Verify video project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING KALMUTTTG PROJECT"
          echo "=========================================="

          test -f index.html
          test -f render.js
          test -f package.json

          test -f Assets/voiceover.mp3
          test -f Assets/still-dre-instrumental.mp3

          echo "Required files and audio assets are present."

          echo ""
          echo "Project files:"
          find . -maxdepth 4 -type f | sort


      # ==========================================================
      # 5. NODE.JS
      # ==========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.locate.outputs.project_dir }}/package.json


      # ==========================================================
      # 6. INSTALL FFMPEG
      # ==========================================================
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "FFprobe:"
          ffprobe -version | head -n 1


      # ==========================================================
      # 7. INSTALL PLAYWRIGHT + CHROMIUM
      # ==========================================================
      - name: Install Playwright renderer
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund

          npx playwright install --with-deps chromium


      # ==========================================================
      # 8. RENDER COMPLETE 60-SECOND VIDEO
      # ==========================================================
      - name: Render complete KALMUTTTG MP4
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output
          mkdir -p output

          echo "=========================================="
          echo "RENDERING COMPLETE KALMUTTTG VIDEO"
          echo "=========================================="

          node render.js

          FINAL="output/KALMUTTTG_Final_Video.mp4"

          if [ ! -f "$FINAL" ]; then

            echo ""
            echo "ERROR: Final MP4 was not generated."

            echo ""
            echo "Output directory:"
            find output -maxdepth 5 -type f -ls || true

            exit 1
          fi

          echo ""
          echo "FINAL MP4 GENERATED:"
          ls -lh "$FINAL"


      # ==========================================================
      # 9. VALIDATE FINAL VIDEO
      # ==========================================================
      - name: Validate final MP4
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          MP4="output/KALMUTTTG_Final_Video.mp4"

          echo "=========================================="
          echo "VALIDATING FINAL VIDEO"
          echo "=========================================="

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$MP4")

          VIDEO_STREAMS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$MP4")

          AUDIO_STREAMS=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$MP4")

          echo ""
          echo "Video duration:"
          echo "$DURATION seconds"

          echo ""
          echo "Video stream:"
          echo "$VIDEO_STREAMS"

          echo ""
          echo "Audio stream:"
          echo "$AUDIO_STREAMS"

          python3 - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          # Final combined video must be approximately 60 seconds.
          if duration < 59.5 or duration > 60.5:
              print(
                  f"ERROR: Expected approximately 60 seconds, "
                  f"got {duration}"
              )
              sys.exit(1)

          print(
              "Duration check passed: "
              "final video is approximately 60 seconds."
          )
          PY

          if ! ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$MP4" | grep -qx "h264"; then

            echo "ERROR: Final video is not H.264."
            exit 1
          fi

          if ! ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$MP4" | grep -qx "aac"; then

            echo "ERROR: Final audio is not AAC."
            exit 1
          fi

          echo ""
          echo "FINAL MP4 VALIDATION PASSED."


      # ==========================================================
      # 10. PREPARE FINAL ARTIFACT
      # ==========================================================
      - name: Prepare final artifact
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf final_video
          mkdir -p final_video

          cp \
            output/KALMUTTTG_Final_Video.mp4 \
            final_video/KALMUTTTG_Final_Video.mp4

          echo ""
          echo "FINAL ARTIFACT:"
          ls -lh final_video/KALMUTTTG_Final_Video.mp4


      # ==========================================================
      # 11. UPLOAD FINAL MP4
      # ==========================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KALMUTTTG-MP4-Video
          path: ${{ steps.locate.outputs.project_dir }}/final_video/KALMUTTTG_Final_Video.mp4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
